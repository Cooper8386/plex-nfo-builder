[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "BLE"]
ignore = ["BLE001"]  # 183 blind-except across services; backlog, not this phase

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
